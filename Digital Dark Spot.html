<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Digital Dark Spot</title>
<style>
:root{--bg:#081226;--cd:#0f1e3a;--ln:#243a66;--tx:#eaf0fc;--mu:#a3b4d4;--ac:#2dd4bf;--ok:#4ade80;--wa:#fbbf24;--er:#fb7185;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.01em;margin:.2em 0}
nav{display:flex;gap:4px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--ln);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav b{font-family:Georgia,serif;margin-right:10px;white-space:nowrap;color:var(--ac);align-self:center}
nav button{background:none;border:0;color:var(--mu);padding:7px 11px;border-radius:8px;cursor:pointer;font:inherit;white-space:nowrap}
nav button.on{background:var(--cd);color:var(--tx);box-shadow:inset 0 -2px var(--ac)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.big{font:700 30px Georgia,serif;color:var(--ac)}
button.p,a.p{background:var(--ac);color:#06201c;border:0;border-radius:8px;padding:10px 18px;font:600 15px inherit;cursor:pointer}
button.s{background:none;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
input,textarea,select{width:100%;background:#0a1730;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:9px;font:inherit;margin:4px 0 10px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.t{display:inline-block;border-radius:99px;padding:1px 10px;font-size:13px;border:1px solid}
.conflict,.High{color:var(--er)}.partial,.Medium{color:var(--wa)}.found{color:var(--ok)}.missing{color:var(--mu)}
.t.conflict{border-color:var(--er)}.t.partial{border-color:var(--wa)}.t.found{border-color:var(--ok)}.t.missing{border-color:var(--mu)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}td,th{border-bottom:1px solid var(--ln);padding:8px;text-align:left;vertical-align:top}
q{display:block;color:var(--mu);font-size:14px;border-left:3px solid var(--ln);padding-left:8px;margin:4px 0;quotes:none}
small,.mu{color:var(--mu)}details summary{cursor:pointer;color:var(--ac);font-size:14px}
.hero{padding:40px 0 20px}.hero h1{font-size:clamp(34px,7vw,60px);line-height:1.05;max-width:14em}
@media(prefers-reduced-motion:no-preference){main>*{animation:f .3s}@keyframes f{from{opacity:0}}}
</style></head><body>
<nav id="nav"></nav><main id="app"></main>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),cap=s=>s[0].toUpperCase()+s.slice(1);
const now=()=>new Date().toISOString();
const DEMO=[{title:'Source A: Example Student Grant 2026 (fictional demo)',url:'',type:'Demo (fictional)',text:'Example Student Grant 2026\nApplication deadline: 15 December 2026.\nIncome eligibility: Below ₹3,00,000.\nDocuments: Marks card, income certificate and bank passbook.\nRenewal conditions: Not mentioned.'},{title:'Source B: Example Student Grant 2026 (fictional demo)',url:'',type:'Demo (fictional)',text:'Example Student Grant 2026\nApplication deadline: 20 December 2026.\nIncome eligibility: Below ₹4,00,000.\nDocuments: Marks card, college ID and bank passbook.\nRenewal conditions: Not mentioned.'}];
let S=DEMO.map(d=>({...d,got:now()})),Q={topic:'Example Student Grant 2026',q:'What should a student verify before applying for the Example Student Grant 2026?',sub:'',cat:'Education and Scholarships'},V='home',chk={},msg='';
const VIEWS=[['home','Home'],['work','Workspace'],['src','Sources'],['dash','Dashboard'],['cmp','Compare'],['rad','Gap Radar'],['chk','Checklist'],['his','History']];
const F={deadline:{l:'Application deadline',c:'Deadlines',re:/deadline[^\n]*?(\d{1,2}\s+[A-Za-z]+\s+\d{4})/i},income:{l:'Income limit',c:'Eligibility',re:/income[^\n]*?₹\s*([\d,]+)/i},age:{l:'Age limit',c:'Eligibility',re:/\bage\b[^\n]*?(\d{2})/i}};
const CATS=['Eligibility','Documents','Deadlines','Renewal','Contact','Verification'];
const QS={Eligibility:'What are the full eligibility conditions?',Documents:'Which documents are required?',Deadlines:'What is the current application deadline?',Renewal:'Is the grant renewable, and on what conditions?',Contact:'Whom can applicants contact for help?',Verification:'Where is the official notification or portal?'};
function ex(t){const f={},L=t.split(/\n/);
for(const k in F)for(const ln of L){const m=ln.match(F[k].re);if(m){f[k]={v:m[1].replace(/,/g,''),raw:m[1],line:ln.trim()};break}}
for(const ln of L){const m=ln.match(/documents?[^:\n]*:\s*(.+)/i);if(m){f.docs={list:m[1].replace(/\.\s*$/,'').split(/,|\band\b/).map(s=>s.trim().toLowerCase()).filter(Boolean),line:ln.trim()};break}}
const P={renewal:/renew/i,contact:/@|\b\d{10}\b|helpline|contact us/i,verify:/official|notification|portal/i};
for(const k in P){const ln=L.find(x=>P[k].test(x)&&!/not mentioned|not listed/i.test(x));if(ln)f[k]={line:ln.trim(),raw:'Mentioned'}}
const d=t.match(/(?:published|last updated|updated)[^\n]*?(\d{1,2}\s+[A-Za-z]+\s+\d{4})/i);if(d)f.pub=d[1];return f}
function analyze(){const n=S.length,fx=S.map(s=>ex(s.text)),rows=[],add=(cat,l,vals,kind)=>{const pr=vals.filter(Boolean);let st='found';if(!pr.length)st='missing';else if(kind=='v'&&new Set(pr.map(v=>v.v)).size>1)st='conflict';else if(pr.length<n)st='partial';rows.push({cat,l,vals,kind,st})};
for(const k in F)add(F[k].c,F[k].l,fx.map(f=>f[k]||null),'v');
[...new Set(fx.flatMap(f=>f.docs?f.docs.list:[]))].forEach(d=>add('Documents',cap(d),fx.map(f=>f.docs&&f.docs.list.includes(d)?{raw:'Required',line:f.docs.line}:null),'d'));
add('Renewal','Renewal conditions',fx.map(f=>f.renewal||null),'p');add('Contact','Contact information',fx.map(f=>f.contact||null),'p');add('Verification','Official source reference',fx.map(f=>f.verify||null),'p');
const cs={};CATS.forEach(c=>{const r=rows.filter(x=>x.cat==c&&x.st!='missing');cs[c]=!r.length?'missing':r.some(x=>x.st=='conflict')?'conflict':r.some(x=>x.st=='partial')?'partial':'found'});
const W={found:1,partial:.5,conflict:.5,missing:0},score=Math.round(100*CATS.reduce((a,c)=>a+W[cs[c]],0)/CATS.length);
const fd=[],ev=r=>r.vals.map((v,i)=>v&&`${S[i].title}: “${v.line}”`).filter(Boolean);
rows.forEach(r=>{const pr=r.vals.filter(Boolean).length;if(r.st=='conflict')fd.push({t:`${r.l} differs between sources`,cat:r.cat,lab:'Possible conflict',ev:ev(r),why:'Values found: '+r.vals.filter(Boolean).map(v=>v.raw).join(' vs ')+'. Neither source is assumed correct.',pri:3});
else if(r.st=='partial')fd.push({t:`${r.l} appears in only ${pr} of ${n} sources`,cat:r.cat,lab:'Possible information gap',ev:ev(r),why:'Other sources do not list it. That is not proof it is unnecessary.',pri:r.cat=='Documents'?3:2});
else if(r.st=='found')fd.push({t:`${r.l}: ${r.vals[0].raw}`,cat:r.cat,lab:'Confirmed from source',ev:ev(r),why:'Consistent across all sources.',pri:0})});
CATS.filter(c=>cs[c]=='missing').forEach(c=>fd.push({t:`${c} information not found in any source`,cat:c,lab:'Possible information gap',ev:[],why:'No collected source mentions it. It may exist elsewhere.',pri:['Renewal','Deadlines'].includes(c)?3:2}));
const fr=[],td=new Date();S.forEach((s,i)=>{const f=fx[i],p=f.pub&&new Date(f.pub);if(!f.pub)fr.push({s:s.title,w:'No publication or update date found',pri:2});else if(!isNaN(p)&&(td-p)/864e5>365)fr.push({s:s.title,w:`Dated ${f.pub}, over a year old`,pri:2});if(f.deadline){const d=new Date(f.deadline.raw);if(!isNaN(d)&&d<td)fr.push({s:s.title,w:`Deadline ${f.deadline.raw} has passed`,pri:3})}});
fr.forEach(x=>fd.push({t:x.w,cat:'Freshness',lab:'Needs verification',ev:[],why:'Source: '+x.s,pri:x.pri}));
const qs=CATS.filter(c=>cs[c]!='found').map(c=>({q:QS[c],c}));
const cl=[{t:'Locate and read the latest official notification',pri:3}];fd.filter(f=>f.pri>0).sort((a,b)=>b.pri-a.pri).forEach(f=>cl.push({t:f.lab=='Possible conflict'?`Confirm the correct value for: ${f.t.replace(' differs between sources','')}`:f.lab=='Needs verification'?`Check freshness: ${f.t}`:`Check: ${f.t}`,pri:f.pri}));
return{rows,cs,score,fd,fr,qs,cl,fx,keys:rows.filter(r=>r.st!='missing').length}}
const tag=s=>`<span class="t ${s}">${{found:'Found',partial:'Partial',conflict:'Conflict',missing:'Missing'}[s]}</span>`,PN={3:'High',2:'Medium',1:'Low'};
function radar(A){const cx=150,cy=150,R=105,pt=(i,v)=>{const a=-Math.PI/2+i*Math.PI/3;return[cx+R*v*Math.cos(a),cy+R*v*Math.sin(a)]},W={found:1,partial:.5,conflict:.5,missing:.04};
const ring=v=>`<polygon points="${CATS.map((c,i)=>pt(i,v).join(',')).join(' ')}" fill="none" stroke="#243a66"/>`;
return`<svg viewBox="0 0 300 300" role="img" aria-label="Information gap radar" style="max-width:380px;width:100%">${[.33,.66,1].map(ring).join('')}${CATS.map((c,i)=>{const[x,y]=pt(i,1),[lx,ly]=pt(i,1.2);return`<line x1="150" y1="150" x2="${x}" y2="${y}" stroke="#243a66"/><text x="${lx}" y="${ly}" fill="#a3b4d4" font-size="10" text-anchor="middle">${c}</text>`}).join('')}<polygon points="${CATS.map((c,i)=>pt(i,W[A.cs[c]]).join(',')).join(' ')}" fill="#2dd4bf55" stroke="#2dd4bf" stroke-width="2"/>${CATS.map((c,i)=>{const[x,y]=pt(i,W[A.cs[c]]);return`<circle cx="${x}" cy="${y}" r="4" fill="${{found:'#4ade80',partial:'#fbbf24',conflict:'#fb7185',missing:'#a3b4d4'}[A.cs[c]]}"/>`}).join('')}</svg>`}
function report(A){return{app:'Digital Dark Spot',generated:now(),analysis_engine:'Rule-based (no AI layer in this build)',question:Q,sources:S.map(s=>({title:s.title,url:s.url||null,type:s.type,retrieved:s.got,characters:s.text.length})),completeness_score:A.score,category_status:A.cs,findings:A.fd,freshness_warnings:A.fr,unanswered_questions:A.qs,checklist:A.cl.map(c=>({...c,done:!!chk[c.t]})),limitations:'Findings come from pattern matching over only the supplied text. A potential gap is not proof that information does not exist elsewhere. Verify against official sources.'}}
function render(){$('#nav').innerHTML='<b>Digital Dark Spot</b>'+VIEWS.map(v=>`<button data-v="${v[0]}" class="${V==v[0]?'on':''}">${v[1]}</button>`).join('');
const A=S.length?analyze():null,E=`<div class="card">Add at least one source first. <button class="s" data-v="src">Go to Sources</button></div>`;let h='';
if(V=='home')h=`<div class="hero"><h1>Find what’s missing. Verify what matters.</h1><p class="mu" style="max-width:36em">Paste or upload sources about a scholarship, scheme or job. Digital Dark Spot shows which details are missing, which sources disagree, what may be out of date, and what to check next.</p><button class="p" data-v="work">Start Research</button> <button class="s" data-v="dash">See the demo analysis</button></div><div class="grid"><div class="card"><b>Gaps</b><br><small>Details no source mentions.</small></div><div class="card"><b>Conflicts</b><br><small>Claims shown side by side.</small></div><div class="card"><b>Freshness</b><br><small>Dates checked against today.</small></div><div class="card"><b>Verify next</b><br><small>A ranked checklist.</small></div></div>`;
else if(V=='work')h=`<h2>Research workspace</h2><div class="card"><label>Topic<input id="qt" value="${esc(Q.topic)}"></label><label>Main research question<textarea id="qq" rows="2">${esc(Q.q)}</textarea></label><label>Subquestions (optional)<textarea id="qs" rows="2">${esc(Q.sub)}</textarea></label><label>Category<select id="qc">${['Education and Scholarships','Government Schemes','Career and Employment','Research and Science','Public Services','General Research'].map(c=>`<option ${c==Q.cat?'selected':''}>${c}</option>`).join('')}</select></label><button class="p" id="go">Analyze ${S.length} source${S.length==1?'':'s'}</button> <button class="s" id="demo">Reset to fictional demo</button></div><p class="mu">The demo uses two fictional sources, not real scholarship information.</p>`;
else if(V=='src')h=`<h2>Sources</h2>${S.map((s,i)=>`<div class="card"><b>${esc(s.title)}</b> <span class="t partial">${esc(s.type)}</span><br><small>${s.url?esc(s.url)+' (not fetched; text supplied by you)':'No URL'} · added ${s.got.slice(0,16).replace('T',' ')} UTC</small><details><summary>Inspect extracted text</summary><pre style="white-space:pre-wrap">${esc(s.text)}</pre></details><button class="s" data-rm="${i}">Remove</button></div>`).join('')||'<div class="card">No sources yet.</div>'}<div class="card"><h3>Add a source</h3><p class="mu">This hosted page cannot fetch websites, and PDF/DOCX extraction needs the backend. Paste the page text or upload a TXT file. URLs are stored as references only.</p><label>Title<input id="st"></label><label>URL (optional reference)<input id="su"></label><label>Text<textarea id="sx" rows="6"></textarea></label><label>Or upload a .txt file<input type="file" id="sf" accept=".txt,text/plain"></label><button class="p" id="add">Add source</button> <span id="m" role="status">${esc(msg)}</span></div>`;
else if(!A)h=E;
else if(V=='dash'){const c=(a,b)=>`<div class="card"><div class="big">${a}</div><small>${b}</small></div>`,g=A.fd.filter(f=>f.lab=='Possible information gap').length,cf=A.fd.filter(f=>f.lab=='Possible conflict').length;
h=`<h2>Analysis dashboard</h2><p class="mu">${esc(Q.q)}<br>Engine: rule-based comparison. No AI model was used, and none is claimed.</p><div class="grid">${c(S.length,'Sources')}${c(A.keys,'Key facts extracted')}${c(g,'Possible gaps')}${c(cf,'Possible conflicts')}${c(A.fr.length,'Freshness warnings')}${c(A.qs.length,'Questions to verify')}</div>`+['Possible conflict','Possible information gap','Needs verification','Confirmed from source'].map(l=>{const L=A.fd.filter(f=>f.lab==l).sort((a,b)=>b.pri-a.pri);return L.length?`<h3>${l}</h3>`+L.map(f=>`<div class="card"><b>${esc(f.t)}</b> <span class="t partial">${f.cat}</span><br><small>Why: ${esc(f.why)} Confidence: ${f.lab=='Possible conflict'||f.lab=='Confirmed from source'?'High (exact comparison)':'Medium (pattern matching)'}</small>${f.ev.map(e=>`<q>${esc(e)}</q>`).join('')}</div>`).join(''):''}).join('')+`<h3>Unanswered questions</h3><div class="card">${A.qs.map(q=>`<div>• ${esc(q.q)}</div>`).join('')||'None flagged.'}</div><h3>Report</h3><div class="card"><button class="p" id="cp">Copy JSON report</button> <button class="s" id="sv">Save session</button> <span id="m" role="status">${esc(msg)}</span><details><summary>Preview report JSON</summary><textarea rows="10" readonly>${esc(JSON.stringify(report(A),null,2))}</textarea></details></div>`}
else if(V=='cmp')h=`<h2>Source comparison</h2><div class="card sc"><table><tr><th>Information</th>${S.map(s=>`<th>${esc(s.title.split(':')[0])}</th>`).join('')}<th>Status</th></tr>${A.rows.map(r=>`<tr><td>${esc(r.l)}</td>${r.vals.map(v=>`<td>${v?esc(v.raw)+`<details><summary>evidence</summary><q>${esc(v.line)}</q></details>`:'<span class="mu">Not listed</span>'}</td>`).join('')}<td>${tag(r.st)}</td></tr>`).join('')}</table></div>`;
else if(V=='rad')h=`<h2>Information gap radar</h2><div class="card" style="text-align:center">${radar(A)}<div class="big">${A.score}%</div><small>Completeness</small></div><div class="card"><b>How the score is calculated</b><p class="mu">Each of 6 categories is scored from what the sources actually contain: found = 1, partial or conflicting = 0.5, missing = 0. The score is the average. No AI confidence is involved.</p>${CATS.map(c=>`<div>${tag(A.cs[c])} ${c}</div>`).join('')}</div>`;
else if(V=='chk')h=`<h2>Verify next</h2>${[3,2,1].map(p=>{const L=A.cl.filter(c=>c.pri==p);return L.length?`<h3 class="${PN[p]}">${PN[p]} priority</h3><div class="card">${L.map(c=>`<label style="display:flex;gap:8px;margin:6px 0"><input type="checkbox" style="width:auto" data-ck="${esc(c.t)}" ${chk[c.t]?'checked':''}>${esc(c.t)}</label>`).join('')}</div>`:''}).join('')}`;
else if(V=='his'){let H=[];try{H=JSON.parse(localStorage.getItem('dds')||'[]')}catch(e){}h=`<h2>Analysis history</h2><p class="mu">Saved in this browser only.</p>${H.map((x,i)=>`<div class="card"><b>${esc(x.q.topic)}</b> · ${x.date.slice(0,10)} · ${x.n} sources · score ${x.score}% <button class="s" data-ld="${i}">Load</button></div>`).join('')||'<div class="card">No saved sessions. Save one from the dashboard.</div>'}`}
$('#app').innerHTML=h}
document.addEventListener('click',e=>{const t=e.target;if(t.dataset.v){V=t.dataset.v;msg='';render();scrollTo(0,0)}
if(t.dataset.rm){S.splice(+t.dataset.rm,1);render()}
if(t.id=='go'){Q={topic:$('#qt').value,q:$('#qq').value,sub:$('#qs').value,cat:$('#qc').value};V='dash';render()}
if(t.id=='demo'){S=DEMO.map(d=>({...d,got:now()}));render()}
if(t.id=='add'){const x=$('#sx').value.trim();if(!x){msg='Add text or upload a file. Empty sources cannot be analyzed.';render();return}S.push({title:$('#st').value||'Untitled source',url:$('#su').value.trim(),type:'User-provided text',text:x,got:now()});msg='';render()}
if(t.id=='cp'){const A=analyze();navigator.clipboard.writeText(JSON.stringify(report(A),null,2)).then(()=>{msg='Copied.';render()},()=>{msg='Copy blocked. Open the preview and copy manually.';render()})}
if(t.id=='sv'){const A=analyze();try{const H=JSON.parse(localStorage.getItem('dds')||'[]');H.unshift({q:Q,S,chk,date:now(),n:S.length,score:A.score});localStorage.setItem('dds',JSON.stringify(H.slice(0,20)));msg='Saved to this browser.'}catch(e){msg='Storage is unavailable here.'}render()}
if(t.dataset.ld){const H=JSON.parse(localStorage.getItem('dds')||'[]')[+t.dataset.ld];Q=H.q;S=H.S;chk=H.chk||{};V='dash';render()}
if(t.dataset.ck){chk[t.dataset.ck]=t.checked}});
document.addEventListener('change',e=>{if(e.target.id=='sf'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#sx').value=r.result;if(!$('#st').value)$('#st').value=f.name;if(!$('#su').value)$('#su').value=''};r.onerror=()=>{msg='Could not read that file.';render()};r.readAsText(f)}});
render();
</script></body></html>
